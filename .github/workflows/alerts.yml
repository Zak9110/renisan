name: Hourly Telegram alerts

# Sends alerts to users whose quiet hours cover the daily Vercel cron. Safe to repeat:
# the platform sends each alert once per user. Skips until both secrets are set.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger alerts
        if: ${{ env.PLATFORM_URL != '' && env.CRON_SECRET != '' }}
        run: |
          curl --fail --silent --show-error --max-time 320 -o /dev/null -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "${PLATFORM_URL%/}/api/cron/alerts"
